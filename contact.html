<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تماس با ما | فروشگاه طوسی</title>
  <style>
    body {
      font-family: 'Vazir', sans-serif;
      direction: rtl;
      margin: 0;
      background-color: #f8f8f8;
      color: #333;
    }
    header {
      background-color: #e0e0e0;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #ccc;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #444;
      font-weight: bold;
    }
    nav a:hover {
      color: #000;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
    }
    button {
      width: 150px;
      padding: 10px;
      background-color: #c0c0c0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      align-self: center;
      font-weight: bold;
    }
    button:hover {
      background-color: #999;
      color: white;
    }
    .info {
      text-align: center;
      margin-top: 40px;
      line-height: 1.8;
    }
    .info a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }
    .map {
      margin-top: 30px;
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 10px;
    }
    footer {
      background-color: #ddd;
      padding: 20px;
      text-align: center;
      color: #555;
      border-top: 2px solid #bbb;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>تماس با فروشگاه طوسی</h1>
    <nav>
      <a href="index.html">خانه</a>
      <a href="products.html">محصولات</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
  </header>

  <div class="container">
    <h2>با ما در ارتباط باشید</h2>
    <form>
      <input type="text" placeholder="نام و نام خانوادگی" required>
      <input type="tel" placeholder="شماره تماس" required>
      <textarea rows="4" placeholder="پیام شما..." required></textarea>
      <button type="submit">ارسال پیام</button>
    </form>

    <div class="info">
      <p>📍 مشهد، خیابان سناباد، بعد از سناباد ۵۹، پلاک ۷۱۹</p>
      <p>📞 ۰۵۱۳۸۴۰۸۷۷۶ | ۰۹۳۷۹۹۲۳۹۷۷ | ۰۹۱۵۵۰۹۲۸۳۵</p>
      <p>📸 <a href="https://instagram.com/toosi.store">@toosi.store</a></p>
    </div>

    <div class="map">
      <iframe src="https://www.google.com/maps?q=مشهد%20سناباد%205۹%20پلاک%207۱۹&output=embed"></iframe>
    </div>
  </div>

  <footer>
    © فروشگاه طوسی - از سال ۱۳۶۳ در خدمت شما
  </footer>

</body>
</html>
